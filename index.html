<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b6b4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KIA Tumbuh" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>KIA Tumbuh</title>
</head>
<body>
  <header>
    <h1>KIA Tumbuh</h1>
    <p class="sub">Halaman tumbuh kembang Buku KIA, 0&ndash;24 bulan</p>
  </header>

  <div id="status" class="banner wait" role="status">Menyiapkan mode offline&hellip;</div>
  <div class="notice">Data hanya tersimpan di HP ini. Untuk uji coba, pakai data contoh (sintetis) saja.</div>

  <main>
    <section id="entry" aria-labelledby="entry-title">
      <h2 id="entry-title">Data anak</h2>
      <form id="form" autocomplete="off" novalidate>
        <label>Kode anak (6 angka, boleh dikosongkan)
          <input id="code" inputmode="numeric" maxlength="6" placeholder="mis. 482133" />
        </label>
        <fieldset>
          <legend>Jenis kelamin</legend>
          <label class="inline"><input type="radio" name="sex" value="L" /> Laki-laki</label>
          <label class="inline"><input type="radio" name="sex" value="P" /> Perempuan</label>
        </fieldset>
        <label>Tanggal lahir
          <input id="dob" type="date" />
        </label>
        <label>Tanggal ukur
          <input id="visit" type="date" />
        </label>
        <label>Berat badan (kg)
          <input id="weight" inputmode="decimal" placeholder="mis. 8,4" />
        </label>
        <label>Panjang badan (cm)
          <input id="length" inputmode="decimal" placeholder="mis. 73,0" />
        </label>
        <p id="form-error" class="error" hidden></p>
        <button type="submit" class="primary">Hitung</button>
      </form>
    </section>

    <section id="result" hidden aria-live="polite"></section>

    <section id="records" aria-labelledby="records-title">
      <h2 id="records-title">Data tersimpan</h2>
      <p id="records-summary" class="muted"></p>
      <div id="records-list"></div>
      <label class="inline"><input id="include-dob" type="checkbox" /> Sertakan tanggal lahir di file CSV</label>
      <div class="row">
        <button id="export-new" class="secondary" type="button">Ekspor data baru (CSV)</button>
        <button id="export-all" class="secondary" type="button">Ekspor semua</button>
      </div>
      <button id="delete-all" class="danger" type="button">Hapus semua data di HP ini</button>
    </section>
  </main>

  <footer>Versi <span id="version"></span> &middot; Alat bantu skrining: petugas yang memutuskan.</footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
